# Academia distro — SearXNG configured for academic research
#
# Focus: Scholar, arXiv, PubMed, DOI, academic journals
# Disabled: shopping, images, videos, social media, general news

use_default_settings:
  engines:
    keep_only:
      - google_scholar
      - arxiv
      - pubmed
      - crossref
      - openalex
      - semantic_scholar
      - google
      - duckduckgo
      - bing
      - wikipedia
      - wikidata

general:
  debug: false
  instance_name: "Academia Search"
  privacymode: false

search:
  safe_search: 0
  autocomplete: "duckduckgo"
  autocomplete_min: 3
  default_lang: "en"

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "change-me-in-production"
  limiter: true
  image_proxy: false

valkey:
  url: "valkey://valkey:6379/0"

brand:
  pwa_colors:
    background_color_light: "#1a365d"
    theme_color_light: "#e2e8f0"
    background_color_dark: "#0f172a"
    theme_color_dark: "#93c5fd"

ui:
  default_theme: academia
  default_locale: "en"
  infoboxes: true
  syntax_highlighting: false

# Academia distro — SearXNG configured for academic research
#
# Focus: Scholar, arXiv, PubMed, DOI, academic journals
# Disabled: shopping, images, videos, social media, general news

use_default_settings: true

general:
  debug: false
  instance_name: "Academia Search"
  privacymode: false

search:
  safe_search: 0
  autocomplete: "duckduckgo"
  autocomplete_min: 3
  default_lang: "en"

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "change-me-in-production"
  limiter: true
  image_proxy: false

valkey:
  url: "valkey://valkey:6379/0"

# Engine configuration
engines:
  # Keep only these engines (all others disabled)
  keep_only:
    - google_scholar
    - arxiv
    - pubmed
    - crossref
    - openalex
    - semantic_scholar
    - google
    - duckduckgo
    - bing
    - wikipedia
    - wikidata

ui:
  default_theme: simple
  default_locale: "en"
  infoboxes: true
  syntax_highlighting: false

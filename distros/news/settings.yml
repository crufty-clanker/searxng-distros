# News distro — SearXNG configured for news and fact-checking
#
# Focus: News sources, fact-checking, multilingual support
# Disabled: shopping, images, videos, social media, developer platforms

use_default_settings: true

general:
  debug: false
  instance_name: "News Search"
  privacymode: false

search:
  safe_search: 0
  autocomplete: "duckduckgo"
  autocomplete_min: 3
  default_lang: "en"

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "change-me-in-production"
  limiter: true
  image_proxy: false

valkey:
  url: "valkey://valkey:6379/0"

brand:
  pwa_colors:
    background: "#7f1d1d"
    accent: "#fca5a5"

# Engine configuration
engines:
  # Keep only these engines (all others disabled)
  keep_only:
    - google_news
    - bing_news
    - reuters
    - tagesschau
    - ansa
    - duckduckgo
    - google
    - bing
    - wikipedia
    - wikidata

ui:
  default_theme: simple
  default_locale: "en"
  infoboxes: true
  syntax_highlighting: false

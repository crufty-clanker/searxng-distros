# Rate limiter configuration for Devtools distro
# Based on SearXNG default schema

[botdetection]

# Prefix for IP address matching
ipv4_prefix = 32
ipv6_prefix = 48

trusted_proxies = [
  '127.0.0.0/8',
  '::1',
]

[botdetection.ip_limit]

# Allow unlimited access in local network
filter_link_local = false

# Activate link_token method
link_token = true

[botdetection.ip_lists]

block_ip = [
]

pass_ip = [
]

# Activate passlist of hardcoded IPs from the SearXNG organization
pass_searxng_org = true

# Devtools distro — SearXNG configured for software developers
#
# Focus: Stack Overflow, GitHub, GitLab, documentation sites, package registries
# Disabled: shopping, images, videos, social media, general news

use_default_settings:
  engines:
    keep_only:
      - stackexchange
      - github
      - gitlab
      - pypi
      - npm
      - crates
      - google
      - google_scholar
      - duckduckgo
      - bing
      - wikipedia

general:
  debug: false
  instance_name: "Devtools Search"
  privacymode: false

search:
  safe_search: 0
  autocomplete: "duckduckgo"
  autocomplete_min: 3
  default_lang: "en"

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "change-me-in-production"
  limiter: true
  image_proxy: false

valkey:
  url: "valkey://valkey:6379/0"

brand:
  pwa_colors:
    background_color_light: "#0f172a"
    theme_color_light: "#22c55e"
    background_color_dark: "#020617"
    theme_color_dark: "#4ade80"

ui:
  default_theme: devtools
  default_locale: "en"
  infoboxes: true
  syntax_highlighting: true

# Limiter config is in limiter.toml — no need to duplicate here

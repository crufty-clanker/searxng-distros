# Archiver distro — SearXNG configured for web archiving
#
# Focus: Web archive, Wayback Machine, cached pages, preservation
# Disabled: shopping, videos, music, social media, developer platforms

use_default_settings: true

general:
  debug: false
  instance_name: "Archiver Search"
  privacymode: false

search:
  safe_search: 0
  autocomplete: "duckduckgo"
  autocomplete_min: 3
  default_lang: "en"

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "change-me-in-production"
  limiter: true
  image_proxy: false

# Enable archiving-focused engines
enabled_engines:
  - google
  - google_images
  - duckduckgo
  - bing
  - wikipedia
  - wikidata
  - annas_archive
  - zlibrary
  - openlibrary

# Disabled engines (not relevant for archiving workflow)
disabled_engines:
  - bing_images
  - bing_videos
  - google_videos
  - google_news
  - bing_news
  - youtube_noapi
  - youtube_api
  - soundcloud
  - spotify
  - vimeo
  - dailymotion
  - piped
  - odysee
  - rumble
  - 9gag
  - imgur
  - deviantart
  - pixiv
  - stackexchange
  - github
  - gitlab
  - arxiv
  - pubmed
  - reuters
  - tagesschau

ui:
  default_theme: simple
  default_locale: "en"
  infoboxes: true
  syntax_highlighting: false

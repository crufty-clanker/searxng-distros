# Archiver distro — SearXNG configured for web archiving
#
# Focus: Web archive, Wayback Machine, cached pages, preservation
# Disabled: shopping, videos, music, social media, developer platforms

use_default_settings:
  engines:
    keep_only:
      - google
      - google_images
      - duckduckgo
      - bing
      - wikipedia
      - wikidata
      - annas_archive
      - zlibrary
      - openlibrary

general:
  debug: false
  instance_name: "Archiver Search"
  privacymode: false

search:
  safe_search: 0
  autocomplete: "duckduckgo"
  autocomplete_min: 3
  default_lang: "en"

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "change-me-in-production"
  limiter: true
  image_proxy: false

valkey:
  url: "valkey://valkey:6379/0"

brand:
  pwa_colors:
    background: "#78350f"
    accent: "#fef3c7"

ui:
  default_theme: simple
  default_locale: "en"
  infoboxes: true
  syntax_highlighting: false

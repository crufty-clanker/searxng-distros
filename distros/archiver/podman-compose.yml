# Podman Compose file for Archiver SearXNG distro
# Run with: podman compose up -d
# Access at: http://localhost:8080

name: searxng-archiver

services:
  searxng:
    build:
      context: .
      dockerfile: Containerfile
    image: searxng/archiver:latest
    container_name: searxng-archiver
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:Z
      - ./limiter.toml:/etc/searxng/limiter.toml:Z
      - archiver-data:/var/cache/searxng/
    depends_on:
      - valkey
    networks:
      - searxng-net

  valkey:
    image: docker.io/valkey/valkey:9-alpine
    container_name: searxng-archiver-valkey
    restart: unless-stopped
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - valkey-data:/data/
    networks:
      - searxng-net

volumes:
  archiver-data:
  valkey-data:

networks:
  searxng-net:
    driver: bridge

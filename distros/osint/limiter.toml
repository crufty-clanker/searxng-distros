# Rate limiter configuration for OSINT distro
# Higher limits for intelligence gathering

[botdetection.ip_limit]
link_token = true

[botdetection.ip_limit.list_ips]
# No IP whitelisting by default

[botdetection.ip_limit.query_limit]
# 30 queries per 5 minutes per IP
per_minute = 30

[botdetection.ip_limit.query_limit_in_between]
# 15 queries per minute per IP
per_minute = 15

[botdetection.ip_limit.use_recaptcha]
# Enable reCAPTCHA for suspicious IPs
enabled = false

[botdetection.ip_limit.reaptcha_path]
# reCAPTCHA path (not used unless enabled)
path = ""

[botdetection.ip_limit.secret]
# Secret key for rate limiting (change in production)
key = "change-me-in-production"
sign_key = "change-me-in-production"

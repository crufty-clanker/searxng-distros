# Purpleteam distro — SearXNG configured for security operations
#
# Focus: Security advisories, CVE, NVD, threat intelligence
# Disabled: shopping, images, videos, music, social media, developer platforms

use_default_settings: true

general:
  debug: false
  instance_name: "Purple Team Search"
  privacymode: false

search:
  safe_search: 0
  autocomplete: "duckduckgo"
  autocomplete_min: 3
  default_lang: "en"

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "change-me-in-production"
  limiter: true
  image_proxy: false

valkey:
  url: "valkey://valkey:6379/0"

brand:
  pwa_colors:
    background: "#4c1d95"
    accent: "#c4b5fd"

# Engine configuration
engines:
  # Keep only these engines (all others disabled)
  keep_only:
    - google
    - duckduckgo
    - bing
    - wikipedia
    - wikidata
    - nvd
    - github_code
    - hackernews
    - privacywall
    - sourcehut
    - gitea
    - reuters
    - tagesschau

ui:
  default_theme: simple
  default_locale: "en"
  infoboxes: true
  syntax_highlighting: true

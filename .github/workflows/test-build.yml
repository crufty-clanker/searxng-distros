name: Test Build

on:
  pull_request:
    paths:
      - 'distros/**/Containerfile'
      - 'distros/**/settings.yml'
      - 'distros/**/limiter.toml'
      - '.github/workflows/test-build.yml'

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      distros: ${{ steps.discover.outputs.distros }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Discover distro subdirs
        id: discover
        shell: bash
        run: |
          # Collect subdirs into a JSON array
          json_array="["
          first=true
          for dir in ./distros/*/; do
            if [ -d "$dir" ]; then
              name=$(basename "$dir")
              if [ "$first" = true ]; then
                json_array="${json_array}\"${name}\""
                first=false
              else
                json_array="${json_array},\"${name}\""
              fi
            fi
          done
          json_array="${json_array}]"
          echo "distros=$json_array" >> "$GITHUB_OUTPUT"
          echo "Distros: $json_array"

  build-and-test:
    needs: discover
    runs-on: ubuntu-latest
    if: needs.discover.outputs.distros != ''

    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.discover.outputs.distros) }}

    name: "test: ${{ matrix.distro }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Buildah
        uses: ./.github/actions/install-buildah

      - name: Build OCI image
        id: build
        run: |
          buildah bud \
            --format oci \
            --isolation chroot \
            --tag "oci-archive:/tmp/${{ matrix.distro }}.tar" \
            -f "${{ matrix.distro }}/Containerfile" \
            "${{ matrix.distro }}"

          echo "tag=oci-archive:/tmp/${{ matrix.distro }}.tar" >> "$GITHUB_OUTPUT"

      - name: Test container health
        run: |
          # Create a container from the image
          CONTAINER=$(buildah from "oci-archive:/tmp/${{ matrix.distro }}.tar")

          # Start the container
          buildah run --isolation chroot "$CONTAINER" \
            sh -c "python -m searx.webapp &"

          # Wait for startup
          sleep 5

          # Health check
          curl --retry 5 --retry-delay 2 --retry-connrefused \
            --fail-with-body \
            http://localhost:8080/health

          # Cleanup
          buildah rm "$CONTAINER"

      - name: Cleanup
        if: always()
        run: rm -f /tmp/${{ matrix.distro }}.tar

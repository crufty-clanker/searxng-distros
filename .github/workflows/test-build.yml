name: Test Build

on:
  pull_request:
    paths:
      - 'distros/**/Containerfile'
      - 'distros/**/settings.yml'
      - 'distros/**/limiter.toml'
      - '.github/workflows/test-build.yml'
  push:
    branches: [main]
    paths:
      - 'distros/**/Containerfile'
      - 'distros/**/settings.yml'
      - 'distros/**/limiter.toml'

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      distros: ${{ steps.discover.outputs.distros }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Discover distro subdirs
        id: discover
        shell: bash
        run: |
          distros=$(find ./distros -maxdepth 1 -mindepth 1 -print0 | \
            xargs -0 -I{} basename {} | \
            sort | \
            paste -sd ',' -)
          echo "distros=$distros" >> "$GITHUB_OUTPUT"
          echo "Distros: $distros"

  build-and-test:
    needs: discover
    runs-on: ubuntu-latest
    if: needs.discover.outputs.distros != ''

    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(format('["{0}"]', needs.discover.outputs.distros)) }}

    name: "test: ${{ matrix.distro }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Buildah
        uses: ./.github/actions/install-buildah

      - name: Build OCI image
        id: build
        run: |
          buildah bud \
            --format oci \
            --isolation chroot \
            --tag "oci-archive:/tmp/${{ matrix.distro }}.tar" \
            -f "${{ matrix.distro }}/Containerfile" \
            "${{ matrix.distro }}"

          echo "tag=oci-archive:/tmp/${{ matrix.distro }}.tar" >> "$GITHUB_OUTPUT"

      - name: Test container health
        run: |
          # Create a container from the image
          CONTAINER=$(buildah from "oci-archive:/tmp/${{ matrix.distro }}.tar")

          # Start the container
          buildah run --isolation chroot "$CONTAINER" \
            sh -c "python -m searx.webapp &"

          # Wait for startup
          sleep 5

          # Health check
          curl --retry 5 --retry-delay 2 --retry-connrefused \
            --fail-with-body \
            http://localhost:8080/health

          # Cleanup
          buildah rm "$CONTAINER"

      - name: Cleanup
        if: always()
        run: rm -f /tmp/${{ matrix.distro }}.tar

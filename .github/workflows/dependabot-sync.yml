name: Dependabot Sync Check

on:
  pull_request:
    paths:
      - 'distros/**/Containerfile'
      - 'distros/**/.buildah'
  schedule:
    # Run daily at 6 AM UTC to catch drift
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-dependabot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check if dependabot.yml is in sync
        id: check
        run: |
          # Save current dependabot.yml
          cp .github/dependabot.yml /tmp/dependabot-before.yml

          # Run the sync script
          ./scripts/regenerate-dependabot.sh

          # Check if file changed
          if ! diff -q /tmp/dependabot-before.yml .github/dependabot.yml > /dev/null 2>&1; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::dependabot.yml is out of sync — will create PR"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::dependabot.yml is in sync"
          fi

      - name: Create PR if changes detected
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: sync dependabot.yml with distros/"
          title: "chore: sync dependabot.yml with distros/"
          body: |
            ## What

            The `dependabot.yml` file is out of sync with the `distros/` directory.

            This PR was auto-generated by the [dependabot-sync-check](/.github/workflows/dependabot-sync.yml) workflow.

            Run `./scripts/regenerate-dependabot.sh` locally to regenerate.

          branch: dependabot-sync
          base: main
          labels: automated

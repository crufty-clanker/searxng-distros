name: Build OCI Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      distro:
        description: 'Specific distro to build (leave empty for all)'
        required: false
        default: ''
      push:
        description: 'Push to registry'
        required: false
        default: 'false'

permissions:
  packages: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      distros: ${{ steps.discover.outputs.distros }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Discover distro subdirs
        id: discover
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.distro }}" ]; then
            echo "distros=[\"${{ github.event.inputs.distro }}\"]" >> "$GITHUB_OUTPUT"
          else
            distros=$(find ./distros -maxdepth 1 -mindepth 1 -print0 | \
              xargs -0 -I{} basename {} | \
              sort | \
              paste -sd ',' -)
            echo "distros=$distros" >> "$GITHUB_OUTPUT"
          fi
          echo "Distros: ${{ steps.discover.outputs.distros }}"

  build:
    needs: discover
    runs-on: ubuntu-latest
    if: always() && needs.discover.outputs.distros != '[]'

    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.discover.outputs.distros) }}

    name: "build: ${{ matrix.distro }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Buildah
        uses: ./.github/actions/install-buildah

      - name: Build OCI image
        id: build
        run: |
          IMAGE_NAME="${{ matrix.distro }}"
          TAG="${GITHUB_REF_NAME#v}"
          # Sanitize tag: replace slashes with dashes for OCI compatibility
          TAG="${TAG//\//-}"

          buildah bud \
            --format oci \
            --isolation chroot \
            --tag "oci-archive:/tmp/${IMAGE_NAME}.tar" \
            -f "${{ matrix.distro }}/Containerfile" \
            "${{ matrix.distro }}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: "${{ matrix.distro }}-image"
          path: /tmp/${{ matrix.distro }}.tar
          retention-days: 5

      - name: Push to registry
        if: github.event.inputs.push == 'true' || startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          TAG="${TAG//\//-}"

          buildah push \
            "oci-archive:/tmp/${{ matrix.distro }}.tar" \
            "docker://${{ secrets.REGISTRY }}/${{ matrix.distro }}:${TAG}"

      - name: Cleanup
        run: rm -f /tmp/${{ matrix.distro }}.tar

name: Syntax Check

on:
  pull_request:
    paths:
      - '**/Containerfile'
      - '**/*.buildah'
      - '.github/workflows/syntax-check.yml'
  push:
    branches: [main]
    paths:
      - '**/Containerfile'
      - '**/*.buildah'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      distros: ${{ steps.discover.outputs.distros }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Discover distro subdirs
        id: discover
        shell: bash
        run: |
          distros=$(find ./distros -maxdepth 1 -mindepth 1 -print0 | \
            xargs -0 -I{} basename {} | \
            sort | \
            jq -R -s 'split("\n") | map(select(length > 0))')
          echo "distros=$distros" >> "$GITHUB_OUTPUT"
          echo "Found: $distros"

  validate:
    needs: discover
    runs-on: ubuntu-latest
    if: needs.discover.outputs.distros != ''

    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.discover.outputs.distros) }}

    name: "syntax: ${{ matrix.distro }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Buildah
        uses: ./.github/actions/install-buildah

      - name: Run syntax check
        run: |
          # buildah bud with --quiet catches syntax errors fast
          # --layers=false skips layer caching, --squash-all avoids final commit
          # --isolation chroot avoids rootless issues on runners
          buildah bud \
            --isolation chroot \
            --quiet \
            --layers=false \
            -f "${{ matrix.distro }}/Containerfile" \
            "${{ matrix.distro }}"

name: Distro CI

on:
  pull_request:
    paths:
      - 'distros/**/Containerfile'
      - 'distros/**/settings.yml'
      - 'distros/**/limiter.toml'
      - '.github/workflows/distros.yml'
  push:
    branches: [main]
    paths:
      - 'distros/**/Containerfile'
      - 'distros/**/settings.yml'
      - 'distros/**/limiter.toml'
  workflow_dispatch:
    inputs:
      step:
        description: 'Which step to run'
        required: false
        default: 'all'
        type: choice
        options:
          - syntax
          - build
          - test
          - all

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      distros: ${{ steps.discover.outputs.distros }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Discover distro subdirs
        id: discover
        shell: bash
        run: |
          distros=$(find ./distros -maxdepth 1 -mindepth 1 -print0 | \
            xargs -0 -I{} basename {} | \
            sort | \
            jq -R -s 'split("\n") | map(select(length > 0))')
          {
            echo "distros<<EOF"
            echo "$distros"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Found: $distros"

  syntax:
    needs: discover
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.step == 'syntax' ||
      github.event.inputs.step == 'all'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.discover.outputs.distros) }}

    name: "syntax: ${{ matrix.distro }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Syntax check
        run: |
          buildah bud --isolation chroot --quiet \
            -f "${{ github.workspace }}/distros/${{ matrix.distro }}/Containerfile" \
            "${{ github.workspace }}/distros/${{ matrix.distro }}"

  build:
    needs: discover
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.step == 'build' ||
      github.event.inputs.step == 'all'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.discover.outputs.distros) }}

    name: "build: ${{ matrix.distro }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        id: build
        run: |
          buildah bud --format oci --quiet \
            -f "${{ github.workspace }}/distros/${{ matrix.distro }}/Containerfile" \
            -o "/tmp/${{ matrix.distro }}.tar" \
            "${{ github.workspace }}/distros/${{ matrix.distro }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: "${{ matrix.distro }}-image"
          path: /tmp/${{ matrix.distro }}.tar
          retention-days: 5

      - name: Cleanup
        if: always()
        run: rm -f /tmp/${{ matrix.distro }}.tar

  test:
    needs:
      - discover
      - build
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.step == 'test' ||
      github.event.inputs.step == 'all'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.discover.outputs.distros) }}

    name: "test: ${{ matrix.distro }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download image
        uses: actions/download-artifact@v8
        with:
          name: "${{ matrix.distro }}-image"
          path: /tmp/

      - name: Test container health
        run: |
          CONTAINER=$(buildah from "oci-archive:/tmp/${{ matrix.distro }}.tar")
          buildah run --isolation chroot "$CONTAINER" \
            sh -c "python -m searx.webapp &"
          # Wait for server to be ready with proper status code check
          for i in $(seq 1 30); do
            HTTP_STATUS=$(curl --silent --write-out '%{http_code}' --output /dev/null \
              http://localhost:8080/health 2>/dev/null) || true
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Health check passed (HTTP $HTTP_STATUS)"
              break
            fi
            echo "Attempt $i: HTTP $HTTP_STATUS — retrying in 2s..."
            sleep 2
          done
          # Final validation: ensure we got a 200
          FINAL_STATUS=$(curl --silent --write-out '%{http_code}' --output /dev/null \
            http://localhost:8080/health)
          if [ "$FINAL_STATUS" != "200" ]; then
            echo "ERROR: Health check failed with HTTP $FINAL_STATUS"
            exit 1
          fi
          buildah rm "$CONTAINER"

      - name: Cleanup
        if: always()
        run: rm -f /tmp/${{ matrix.distro }}.tar

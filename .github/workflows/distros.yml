name: Distro CI

on:
  pull_request:
    paths:
      - 'distros/**/Containerfile'
      - 'distros/**/settings.yml'
      - 'distros/**/limiter.toml'
      - '.github/workflows/distros.yml'
  push:
    branches: [main]
    paths:
      - 'distros/**/Containerfile'
      - 'distros/**/settings.yml'
      - 'distros/**/limiter.toml'
  workflow_dispatch:
    inputs:
      step:
        description: 'Which step to run'
        required: false
        default: 'all'
        type: choice
        options:
          - syntax
          - build
          - test
          - all

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      distros: ${{ steps.discover.outputs.distros }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Required for git diff

      - name: Discover changed distros
        id: discover
        shell: bash
        run: |
          # Get list of changed distros
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # For PRs, get changed distros from base to head
            BASE_REF="${{ github.event.pull_request.base.sha }}"
            HEAD_REF="${{ github.event.pull_request.head.sha }}"
            CHANGED_DISTROS=$(git diff --name-only "$BASE_REF"..."$HEAD_REF" -- distros/ 2>/dev/null | \
              grep -E '^distros/[^/]+/' | \
              cut -d'/' -f2 | \
              sort -u | \
              jq -R -s 'split("\n") | map(select(length > 0))')
          else
            # For pushes, run all distros
            CHANGED_DISTROS=$(find ./distros -maxdepth 1 -mindepth 1 -print0 | \
              xargs -0 -I{} basename {} | \
              sort | \
              jq -R -s 'split("\n") | map(select(length > 0))')
          fi
          
          # Default to all distros if no changes detected
          if [ -z "$CHANGED_DISTROS" ] || [ "$CHANGED_DISTROS" = "[]" ]; then
            CHANGED_DISTROS=$(find ./distros -maxdepth 1 -mindepth 1 -print0 | \
              xargs -0 -I{} basename {} | \
              sort | \
              jq -R -s 'split("\n") | map(select(length > 0))')
          fi
          
          {
            echo "distros<<EOF"
            echo "$CHANGED_DISTROS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Distros to process: $CHANGED_DISTROS"

  syntax:
    needs: discover
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.step == 'syntax' ||
      github.event.inputs.step == 'all'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.discover.outputs.distros) }}

    name: "syntax: ${{ matrix.distro }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Syntax check
        run: |
          buildah bud --isolation chroot --quiet \
            -f "${{ github.workspace }}/distros/${{ matrix.distro }}/Containerfile" \
            "${{ github.workspace }}/distros/${{ matrix.distro }}"

  build:
    needs: discover
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.step == 'build' ||
      github.event.inputs.step == 'all'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.discover.outputs.distros) }}

    name: "build: ${{ matrix.distro }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        id: build
        run: |
          buildah bud --quiet \
            --format oci \
            --output type=tar,dest=/tmp/${{ matrix.distro }}.tar \
            -f "${{ github.workspace }}/distros/${{ matrix.distro }}/Containerfile" \
            "${{ github.workspace }}/distros/${{ matrix.distro }}"
          
          # Verify the output file
          echo "Build output:"
          ls -lh /tmp/${{ matrix.distro }}.tar
          file /tmp/${{ matrix.distro }}.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: "${{ matrix.distro }}.tar"
          path: "/tmp/${{ matrix.distro }}.tar"
          retention-days: 1

  test:
    needs:
      - discover
      - build
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.step == 'test' ||
      github.event.inputs.step == 'all'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.discover.outputs.distros) }}

    name: "test: ${{ matrix.distro }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman

      - name: Download image
        uses: actions/download-artifact@v8
        with:
          name: "${{ matrix.distro }}.tar"
          path: /tmp

      - name: Verify artifact
        run: |
          ls -la /tmp/
          if [ ! -f "/tmp/${{ matrix.distro }}.tar" ]; then
            echo "ERROR: ${matrix.distro}.tar not found in /tmp/"
            exit 1
          fi
          echo "Found: /tmp/${{ matrix.distro }}.tar"

      - name: Test container health
        run: |
          podman run --detach --name test-container \
            --network host \
            "oci-archive:/tmp/${{ matrix.distro }}.tar:latest" \
            python -m searx.webapp
          # Wait for server to be ready with proper status code check
          for i in $(seq 1 30); do
            HTTP_STATUS=$(curl --silent --write-out '%{http_code}' --output /dev/null \
              http://localhost:8080/health 2>/dev/null) || true
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Health check passed (HTTP $HTTP_STATUS)"
              break
            fi
            echo "Attempt $i: HTTP $HTTP_STATUS — retrying in 2s..."
            sleep 2
          done
          # Final validation: ensure we got a 200
          FINAL_STATUS=$(curl --silent --write-out '%{http_code}' --output /dev/null \
            http://localhost:8080/health)
          if [ "$FINAL_STATUS" != "200" ]; then
            echo "ERROR: Health check failed with HTTP $FINAL_STATUS"
            exit 1
          fi
          buildah rm "$CONTAINER"

      - name: Cleanup
        if: always()
        run: |
          rm -f /tmp/${{ matrix.distro }}.tar
          podman rm -f test-container 2>/dev/null || true

  test-run:
    needs:
      - discover
      - build
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.step == 'test' ||
      github.event.inputs.step == 'all'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.discover.outputs.distros) }}

    name: "test-run: ${{ matrix.distro }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman

      - name: Download image
        uses: actions/download-artifact@v8
        with:
          name: "${{ matrix.distro }}.tar"
          path: /tmp

      - name: Verify artifact
        run: |
          ls -la /tmp/
          if [ ! -f "/tmp/${{ matrix.distro }}.tar" ]; then
            echo "ERROR: ${matrix.distro}.tar not found in /tmp/"
            exit 1
          fi
          echo "Found: /tmp/${{ matrix.distro }}.tar"

      - name: Run container and check logs
        id: run
        run: |
          # Run SearXNG in background and capture output
          podman run --detach --name test-container \
            --network host \
            "oci-archive:/tmp/${{ matrix.distro }}.tar:latest" \
            sh -c "python -m searx.webapp > /tmp/searx.log 2>&1 &"
          
          # Wait for server to be ready
          for i in $(seq 1 30); do
            HTTP_STATUS=$(curl --silent --write-out '%{http_code}' --output /dev/null \
              http://localhost:8080/health 2>/dev/null) || true
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Server is ready (HTTP $HTTP_STATUS)"
              break
            fi
            echo "Attempt $i: HTTP $HTTP_STATUS — retrying in 2s..."
            sleep 2
          done
          
          # Check health one more time
          FINAL_STATUS=$(curl --silent --write-out '%{http_code}' --output /dev/null \
            http://localhost:8080/health)
          if [ "$FINAL_STATUS" != "200" ]; then
            echo "ERROR: Server failed to start"
            exit 1
          fi
          
          # Save logs
          cp /tmp/searx.log /tmp/searx-logs.txt
          
          # Stop the container
          podman rm -f test-container 2>/dev/null || true
          
          echo "container_id=$CONTAINER" >> "$GITHUB_OUTPUT"

      - name: Check logs for errors
        if: always()
        run: |
          if [ -f /tmp/searx-logs.txt ]; then
            echo "=== SearXNG Logs ==="
            cat /tmp/searx-logs.txt
            
            # Check for common error patterns
            if grep -qi "error\|exception\|traceback\|fatal\|crash" /tmp/searx-logs.txt; then
              echo ""
              echo "❌ ERROR: Found error patterns in logs"
              grep -i "error\|exception\|traceback\|fatal\|crash" /tmp/searx-logs.txt | head -20
              exit 1
            else
              echo ""
              echo "✅ No error patterns found in logs"
            fi
          else
            echo "No logs file found"
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "${{ matrix.distro }}-logs"
          path: /tmp/searx-logs.txt
          retention-days: 5

      - name: Cleanup
        if: always()
        run: rm -f /tmp/${{ matrix.distro }}.tar /tmp/searx-logs.txt
